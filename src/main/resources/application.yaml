spring:
  application:
    name: MeetingApi
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/meeting?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    # 数据库用户名
    username: root
    # 数据库密码
    password: 123456
    hikari:
      pool-name: MeetingApi
      minimum-idle: 5
      idle-timeout: 180000
      maximum-pool-size: 10
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      database: 0
      host: localhost
      port: 6379
      jedis:
        pool:
          max-active: 20
          max-wait: -1ms
          max-idle: 10
          min-idle: 0
      connect-timeout: 2000
      timeout: 2000
      password: 123456
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    publisher-confirm-type: correlated   # 消息到达broker回调
    publisher-returns: true              # 消息路由失败退回
    template:
      mandatory: true                   # 路由失败时触发ReturnCallback
    listener:
      simple:
        acknowledge-mode: manual        # manual手动ACK / auto自动(不推荐生产)
        prefetch: 1                     # 一次拿1条消息，防止消息堆积
        concurrency: 2                  # 消费线程数
        max-concurrency: 4
mybatis‑plus:
  # mapper xml 文件位置
  mapper‑locations: classpath:mapper/**/*.xml
  # 实体类别名包，xml中可以直接写类名，不用全限定名
  type‑aliases‑package: api.meeting.entity.po
  configuration:
    # 打印sql日志
    #    log‑impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名转换：user_name → userName
    map‑underscore‑to‑camel‑case: true
  global‑config:
    db‑config:
      id‑type: assign_id
      table-prefix: meeting_
# jwt 配置
jwt:
  secret: Pioneer***^^^@
  expiration: 86400000 # 1天
  refresh-expiration: 604800000 # 7天
  header: Authorization
  prefix: "Bearer "
  issuer: "Davaid.Ju"

